services:
  - type: web
    name: riskengine
    runtime: docker
    plan: free
    numInstances: 1
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RISKENGINE_ADMIN_EMAIL
        value: admin@riskengine.com
      - key: RISKENGINE_ADMIN_PASSWORD
        sync: false
      - key: RISKENGINE_ALLOWED_ORIGINS
        value: https://riskengine.criveradev.com,https://riskengine-ochre.vercel.app,https://riskengine-s0dr.onrender.com
