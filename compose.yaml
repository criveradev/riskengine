services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: riskengine
      POSTGRES_USER: riskengine
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecuta scripts/setup.py primero}
    volumes:
      - riskengine_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskengine -d riskengine"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://riskengine:${POSTGRES_PASSWORD}@db:5432/riskengine
      RISKENGINE_ADMIN_EMAIL: ${RISKENGINE_ADMIN_EMAIL:?Configura scripts/configure_admin.py primero}
      RISKENGINE_ADMIN_PASSWORD: ${RISKENGINE_ADMIN_PASSWORD:?Configura scripts/configure_admin.py primero}
    depends_on:
      db:
        condition: service_healthy
volumes:
  riskengine_data:
