[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riskengine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.1",
  "alembic>=1.13,<2", "defusedxml>=0.7,<1", "python-multipart>=0.0.18,<1",
  "httpx>=0.27,<1", "python-dotenv>=1,<2", "psycopg[binary]>=3.2,<4",
  "cvss>=3.6,<4",
  "reportlab>=4.5.1,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pypdf>=6.10,<7"]

[tool.setuptools.packages.find]
include = ["riskengine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
